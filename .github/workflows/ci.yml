name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Build docs (sphinx)
        run: |
          uv sync --group docs
          uv run sphinx-build -b html docs _build/html

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: _build/html/
