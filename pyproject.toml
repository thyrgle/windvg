[project]
name = "windvg"
version = "0.1.0"
description = "Parametric perimeter drawing: anchor points on polygons and circles, exported to TinyVG and SVG"
readme = "README.md"
authors = [
    { name = "Christopher Sumnicht", email = "csumnicht@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5.2",
]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
